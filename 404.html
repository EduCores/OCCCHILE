<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0d4b22" />
  <title>Página no encontrada · Operation Christmas Child Chile</title>
  <meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio de Operation Christmas Child Chile." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='12' width='24' height='16' rx='3' fill='%23b3122e'/%3E%3Crect x='2' y='8' width='28' height='6' rx='2' fill='%23d61f3c'/%3E%3Crect x='14' y='8' width='4' height='20' fill='%23f2b33d'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=300" />
  <style>
    .err-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(60% 45% at 18% 20%, rgba(242, 179, 61, .14), transparent 62%),
        radial-gradient(55% 45% at 84% 80%, rgba(214, 31, 60, .18), transparent 64%),
        linear-gradient(160deg, #115d28 0%, #09351a 55%, #062111 100%);
    }
    .err-card {
      width: min(560px, 100%);
      text-align: center;
      padding: clamp(28px, 5vw, 48px);
      border-radius: 26px;
      background: linear-gradient(155deg, rgba(255, 255, 255, .10), rgba(5, 24, 13, .82));
      border: 1px solid rgba(255, 255, 255, .18);
      border-top-color: rgba(255, 255, 255, .32);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 56px -14px rgba(0, 0, 0, .55);
    }
    .err-card__logo {
      height: 52px;
      width: auto;
      margin: 0 auto 20px;
    }
    .err-card__code {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #fde3a7;
      background: rgba(242, 179, 61, .16);
      border: 1px solid rgba(242, 179, 61, .34);
      margin-bottom: 14px;
    }
    .err-card h1 {
      margin: 0 0 12px;
      font-family: var(--display, 'Fraunces', serif);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: #ffffff;
      line-height: 1.2;
    }
    .err-card p {
      margin: 0 auto 26px;
      max-width: 40ch;
      color: rgba(235, 242, 236, .84);
      font-size: .95rem;
      line-height: 1.6;
    }
    .err-card__actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
</head>
<body>
  <main class="err-page">
    <section class="err-card" aria-labelledby="errTitle">
      <img src="img/occchile-logo.png" alt="Operation Christmas Child Chile" class="err-card__logo" width="1024" height="400" decoding="async" />
      <span class="err-card__code">Error 404</span>
      <h1 id="errTitle">Esta cajita tomó otra ruta</h1>
      <p>La página que buscas no existe o cambió de dirección. Vuelve al inicio para seguir conociendo nuestra obra en Chile.</p>
      <div class="err-card__actions">
        <a href="index.html" class="btn btn--primary btn--lc">Volver al inicio</a>
        <a href="index.html#postular" class="btn btn--ghost btn--lc">Postular mi iglesia</a>
      </div>
    </section>
  </main>
</body>
</html>
